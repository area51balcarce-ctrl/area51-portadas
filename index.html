<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AREA 51 - Portadas PRO</title>
<style>
body {
  font-family: Arial;
  background: #0d0d0d;
  color: white;
  text-align: center;
  padding: 40px;
}
input {
  padding: 10px;
  width: 250px;
}
button {
  padding: 10px 20px;
  cursor: pointer;
}
img {
  margin-top: 20px;
  max-width: 300px;
}
</style>
</head>
<body>

<h1>🎮 Portadas PRO</h1>

<input id="juego" placeholder="Ej: The Last of Us" />
<button onclick="buscar()">Buscar</button>

<div id="resultado"></div>

<script>
async function buscar() {
  const juego = document.getElementById("juego").value;

  const res = await fetch(`/api/buscarPortada?juego=${encodeURIComponent(juego)}`);
  const data = await res.json();

  const div = document.getElementById("resultado");

  if (data.error) {
    div.innerHTML = "No encontrada";
    return;
  }

resultado.innerHTML = `
  <div class="result">
    <img src="${data.imagen}" alt="${data.juego}">
    <h3>${data.juego}</h3>

    <div style="margin-top:10px;">
      <a href="${data.imagen}" download target="_blank">
        <button>⬇ Descargar portada</button>
      </a>
    </div>

  </div>
`;
</script>

</body>
</html>
