<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AREA 51 - Portadas HD</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #3b0057, #05010a 65%, #000);
  padding: 20px;
  box-sizing: border-box;
}

.card {
  width: 100%;
  max-width: 980px;
  margin: auto;
  background: #fff;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 0 28px rgba(0, 230, 118, .45);
}

h1 {
  margin: 0 0 6px;
  font-size: 22px;
}

p {
  margin-top: 0;
  color: #555;
  font-size: 13px;
}

label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

.row {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #bbb;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 999px;
  padding: 12px 18px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: linear-gradient(90deg, #00e676, #25d366);
  box-shadow: 0 0 12px rgba(0, 230, 118, .45);
}

.status {
  margin-top: 12px;
  font-size: 13px;
  font-weight: bold;
}

.error {
  color: #c62828;
}

.ok {
  color: #0a8f3c;
}

.gallery {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 18px;
}

.item {
  background: #f0fff4;
  border: 1px solid #b7ebc6;
  border-radius: 14px;
  padding: 12px;
  text-align: center;
}

.item img {
  width: 100%;
  height: 270px;
  object-fit: cover;
  border-radius: 12px;
  background: #111;
}

.item h3 {
  font-size: 14px;
  margin: 10px 0 4px;
}

.item p {
  margin: 0 0 10px;
  font-size: 12px;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn-secondary {
  background: linear-gradient(90deg, #3b0057, #6a008f);
}

@media (max-width: 600px) {
  .row {
    flex-direction: column;
  }

  .gallery {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }

  .item img {
    height: 220px;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1>AREA 51 - Portadas HD</h1>
  <p>Buscador de portadas verticales 600x900. Elegís una y se descarga al toque.</p>

  <label>Nombre del juego</label>
  <div class="row">
    <input id="juego" placeholder="Ej: God of War"
           onkeydown="if(event.key==='Enter') buscarPortadas()" />
    <button onclick="buscarPortadas()">Buscar</button>
  </div>

  <div id="estado" class="status"></div>
  <div id="resultado"></div>
</div>

<script>
async function buscarPortadas() {
  const juego = document.getElementById("juego").value.trim();
  const estado = document.getElementById("estado");
  const resultado = document.getElementById("resultado");

  resultado.innerHTML = "";

  if (!juego) {
    estado.textContent = "Ingresá el nombre del juego.";
    estado.className = "status error";
    return;
  }

  estado.textContent = "Buscando portadas HD...";
  estado.className = "status";

  try {
    const res = await fetch("/api/buscarPortada?juego=" + encodeURIComponent(juego));
    const data = await res.json();

    if (!data.ok) {
      estado.textContent = data.error || "No encontrada.";
      estado.className = "status error";
      return;
    }

    estado.textContent = `${data.portadas.length} portadas encontradas ✅`;
    estado.className = "status ok";

    resultado.innerHTML = `
      <div class="gallery">
        ${data.portadas.map((img, index) => `
          <div class="item">
            <img src="${img.thumb || img.url}" alt="${data.juego}">
            <h3>${data.juego}</h3>
            <p>${img.width || "-"} x ${img.height || "-"}</p>

            <div class="actions">
              <button onclick="descargarImagen('${img.url}', '${limpiarNombre(data.juego)}_${index + 1}.jpg')">
                ⬇ Descargar
              </button>

              <a href="${img.url}" target="_blank">
                <button class="btn-secondary">Ver grande</button>
              </a>
            </div>
          </div>
        `).join("")}
      </div>
    `;

  } catch (error) {
    console.error(error);
    estado.textContent = "Error conectando con la API.";
    estado.className = "status error";
  }
}

function limpiarNombre(nombre) {
  return nombre
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

async function descargarImagen(url, nombreArchivo) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();

    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = blobUrl;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();

    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);

  } catch (error) {
    console.error(error);
    window.open(url, "_blank");
  }
}
</script>

</body>
</html>
